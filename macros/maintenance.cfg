[gcode_macro CALIBRATE_MESH]
description: Heat soak then calibrate bed mesh
gcode:
    {% set BED_TEMP = params.BED|default(60)|float %}
    {% set EXTRUDER_TEMP = params.HOTEND|default(150)|float %}
    {% set SOAK = params.SOAK|default(5)|int %}

    M117 Heating...
    M140 S{BED_TEMP}
    M104 S{EXTRUDER_TEMP}

    M190 S{BED_TEMP}
    M109 S{EXTRUDER_TEMP}

    M117 Heat soak ({SOAK} min)
    G4 P{SOAK * 60000}

    G28
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE SAMPLES=2
    BED_MESH_PROFILE SAVE=default

    M117 Mesh saved