[gcode_macro LINE_PURGE]
description: Double-width purge line at front of bed

gcode:
    {% set x_start = 10.0 %}
    {% set y_pos = 215.0 %}
    {% set line_length = 200.0 %}
    {% set line_spacing = 0.42 %}
    {% set z_height = 0.20 %}
    {% set purge_1 = 18.0 %}
    {% set purge_2 = 15.0 %}
    {% set purge_speed = 900 %}
    {% set travel_speed = 6000 %}

    G90                             ; Absolute positioning
    M83                             ; Relative extrusion

    # Lift nozzle and move to purge start
    G1 Z5 F3000
    G1 X{x_start} Y{y_pos} F{travel_speed}
    G1 Z{z_height} F600

    # First purge line (left to right)
    G92 E0
    G1 X{x_start + line_length} E{purge_1} F{purge_speed}

    # Move one extrusion width towards the rear
    G1 Y{y_pos - line_spacing} F3000

    # Second purge line (right to left)
    G1 X{x_start} E{purge_2} F{purge_speed}

    # Reset extruder and lift clear
    G92 E0
    G1 Z5.0 F1200
    G1 X0.0 F1200