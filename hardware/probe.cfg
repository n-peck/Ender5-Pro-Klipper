#####################################################################
# CR Touch
#####################################################################

[bltouch]
sensor_pin: ^PC14
control_pin: PA1

x_offset: -44
y_offset: -9
z_offset: 0.390

speed: 5.0
lift_speed: 15

samples: 3
samples_result: median

sample_retract_dist: 3.0
samples_tolerance: 0.02
samples_tolerance_retries: 3

[safe_z_home]
home_xy_position: 66,101    #puts probe at 110,110 to account for offset
speed: 100
z_hop: 10
z_hop_speed: 10