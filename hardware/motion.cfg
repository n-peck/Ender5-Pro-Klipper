#####################################################################
# Motion System
#
# Ender 5 Pro
# SKR Mini E3 V3
#
# Commissioning Version
#####################################################################

#############################################################
# X Axis
#############################################################

[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 0
position_max: 220
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.58
stealthchop_threshold: 999999


#############################################################
# Y Axis
#############################################################

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 220
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.58
stealthchop_threshold: 999999


#############################################################
# Z Axis
#############################################################

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 300

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.58
stealthchop_threshold: 999999


#############################################################
# Extruder
#############################################################

[extruder]
step_pin: PB3
dir_pin: PB4
enable_pin: !PD1

microsteps: 16
rotation_distance: 22.678

nozzle_diameter: 0.400
filament_diameter: 1.750

heater_pin: PC8
sensor_pin: PA0
sensor_type: EPCOS 100K B57560G104F

control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982

min_temp: 0
max_temp: 300

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.80
stealthchop_threshold: 0
